# Stateful identity demo: web-0, web-1, web-2 - stable names, ordered start, own PVC each.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  clusterIP: None                       # headless: gives each pod a stable DNS name
  selector: { app: web }
  ports: [{ port: 80, name: http }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: demo
spec:
  serviceName: web                      # must reference the headless service
  replicas: 3
  podManagementPolicy: OrderedReady     # or Parallel
  selector:
    matchLabels: { app: web }
  updateStrategy:
    type: RollingUpdate                 # updates highest ordinal first (web-2 -> web-0)
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          command: ["sh", "-c", "echo \"I am $(hostname)\" > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"]
          volumeMounts:
            - { name: data, mountPath: /var/cache/nginx }
  volumeClaimTemplates:                 # one PVC per replica: data-web-0, data-web-1, ...
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 100Mi }
