apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kust-prod
namePrefix: prod-
resources:
  - ../../base
replicas:
  - name: hello                         # base name (before prefix)
    count: 3
images:
  - name: hello-app
    newTag: "2.0"
configMapGenerator:
  - name: app-config
    literals:
      - APP_GREETING=Hello from PROD overlay
      - APP_VERSION=prod
patches:
  - target:
      kind: Deployment
      name: hello
    patch: |-                           # strategic-merge style patch inline (JSON6902 also supported)
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hello
      spec:
        template:
          spec:
            containers:
              - name: hello
                resources:
                  requests: { cpu: 200m, memory: 384Mi }
                  limits:   { memory: 768Mi }
