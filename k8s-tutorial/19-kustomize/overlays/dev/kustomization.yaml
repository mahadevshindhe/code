apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kust-dev
namePrefix: dev-
resources:
  - ../../base
configMapGenerator:                    # name gets a content hash suffix -> config change triggers a rollout
  - name: app-config
    literals:
      - APP_GREETING=Hello from DEV overlay
      - APP_VERSION=dev
