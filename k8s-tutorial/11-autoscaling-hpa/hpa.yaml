apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: hello, namespace: demo }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }     # 50% of requested CPU (50m per pod)
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 30 }]     # at most +2 pods per 30s
    scaleDown:
      stabilizationWindowSeconds: 60                              # default 300s; shortened for the demo
      policies: [{ type: Percent, value: 50, periodSeconds: 30 }]
