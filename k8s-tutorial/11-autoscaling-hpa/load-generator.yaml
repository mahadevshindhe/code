apiVersion: apps/v1
kind: Deployment
metadata: { name: load-generator, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: load-generator } }
  template:
    metadata: { labels: { app: load-generator } }
    spec:
      containers:
        - name: loader
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- 'http://hello/burn?seconds=20' >/dev/null; done"]
