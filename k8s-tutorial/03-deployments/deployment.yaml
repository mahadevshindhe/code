apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
  labels: { app: hello }
spec:
  replicas: 3
  revisionHistoryLimit: 5                  # how many old ReplicaSets to keep for rollback
  selector:
    matchLabels: { app: hello }            # must match template labels (immutable)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                          # up to 1 extra pod during update
      maxUnavailable: 0                    # never drop below desired replicas -> zero downtime
  minReadySeconds: 5
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: hello
          image: hello-app:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: APP_VERSION, value: "v1" }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          readinessProbe:                  # rollout only proceeds when new pods are Ready
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: demo
spec:
  selector: { app: hello }
  ports: [{ port: 80, targetPort: 8080 }]
