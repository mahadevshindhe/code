# Egress control: frontend may only talk to backend + DNS (no internet, no db)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-egress, namespace: netpol-demo }
spec:
  podSelector:
    matchLabels: { role: frontend }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { role: backend }
      ports: [{ protocol: TCP, port: 80 }]
    - to:                                             # DNS (CoreDNS in kube-system)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
