# TLS termination at the ingress (secret created by create-tls.sh)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-routing
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [secure.localtest.me]
      secretName: secure-tls
  rules:
    - host: secure.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: hello, port: { number: 80 } } }
