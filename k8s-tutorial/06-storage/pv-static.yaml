# Static provisioning: admin creates PV, user claims it with a PVC.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv
  labels: { tutorial: k8s }
spec:
  capacity:
    storage: 500Mi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain      # Retain | Delete | (Recycle deprecated)
  storageClassName: manual
  hostPath:
    path: /tmp/manual-pv                     # path INSIDE the kind node container (demo only; use real storage in prod)
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-claim
  namespace: demo
spec:
  storageClassName: manual
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: static-pv-pod
  namespace: demo
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "echo \"written at $(date)\" >> /mnt/data/log.txt; cat /mnt/data/log.txt; sleep 3600"]
      volumeMounts:
        - { name: vol, mountPath: /mnt/data }
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: manual-claim
