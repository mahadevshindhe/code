# 1) ClusterIP (default): stable virtual IP + DNS name, reachable only inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: hello-clusterip
  namespace: demo
spec:
  type: ClusterIP
  selector: { app: hello }
  ports:
    - name: http
      port: 80               # service port
      targetPort: http       # container port (by name) -> 8080
---
# 2) NodePort: also opens a port on EVERY node (30000-32767). kind maps 30080 -> localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: hello-nodeport
  namespace: demo
spec:
  type: NodePort
  selector: { app: hello }
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
---
# 3) Headless: no virtual IP; DNS returns the IPs of all ready pods (used by StatefulSets, client-side LB)
apiVersion: v1
kind: Service
metadata:
  name: hello-headless
  namespace: demo
spec:
  clusterIP: None
  selector: { app: hello }
  ports: [{ port: 8080, targetPort: http }]
---
# 4) ExternalName: DNS CNAME to an external host (no proxying)
apiVersion: v1
kind: Service
metadata:
  name: external-api
  namespace: demo
spec:
  type: ExternalName
  externalName: example.com
---
# 5) LoadBalancer: asks the cloud for an LB. On kind it stays <pending> unless you run cloud-provider-kind
#    (https://github.com/kubernetes-sigs/cloud-provider-kind) or use minikube tunnel / Docker Desktop.
apiVersion: v1
kind: Service
metadata:
  name: hello-lb
  namespace: demo
spec:
  type: LoadBalancer
  selector: { app: hello }
  ports: [{ port: 80, targetPort: http }]
