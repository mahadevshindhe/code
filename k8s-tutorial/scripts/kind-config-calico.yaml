# Same as kind-config.yaml but WITHOUT the default CNI so Calico can enforce NetworkPolicy (module 15).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-tutorial
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80,    hostPort: 8080, protocol: TCP }
      - { containerPort: 443,   hostPort: 8443, protocol: TCP }
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "disktype=ssd,zone=zone-a"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "disktype=hdd,zone=zone-b"
