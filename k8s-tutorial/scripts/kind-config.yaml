# 1 control-plane + 2 workers. Port mappings let you reach the cluster from your laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-tutorial
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80,    hostPort: 8080, protocol: TCP }   # Ingress HTTP  -> http://localhost:8080
      - { containerPort: 443,   hostPort: 8443, protocol: TCP }   # Ingress HTTPS -> https://localhost:8443
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }  # NodePort demo -> http://localhost:30080
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "disktype=ssd,zone=zone-a"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "disktype=hdd,zone=zone-b"
