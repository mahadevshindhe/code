# One-off run-to-completion task
apiVersion: batch/v1
kind: Job
metadata: { name: pi-job, namespace: demo }
spec:
  backoffLimit: 3                       # retries before marking Failed
  ttlSecondsAfterFinished: 300          # auto-clean finished job + pods
  template:
    spec:
      restartPolicy: Never              # Jobs require Never or OnFailure
      containers:
        - name: pi
          image: busybox:1.36
          command: ["sh", "-c", "echo 'computing...'; sleep 5; echo 'done: 3.14159'"]
---
# Parallel work-queue style: 6 completions, 2 at a time
apiVersion: batch/v1
kind: Job
metadata: { name: parallel-job, namespace: demo }
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed               # each pod gets JOB_COMPLETION_INDEX (0..5)
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo processing chunk $JOB_COMPLETION_INDEX; sleep 8"]
---
# Failing job: observe retries / backoff
apiVersion: batch/v1
kind: Job
metadata: { name: failing-job, namespace: demo }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.36
          command: ["sh", "-c", "echo oops; exit 1"]
