# Custom Resource Definition: teaches the API server a NEW resource type "HelloApp" (group tutorial.example.com)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helloapps.tutorial.example.com
spec:
  group: tutorial.example.com
  scope: Namespaced
  names:
    plural: helloapps
    singular: helloapp
    kind: HelloApp
    shortNames: [ha]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}                              # enables /status subresource (controllers write status separately)
      additionalPrinterColumns:
        - { name: Replicas, type: integer, jsonPath: .spec.replicas }
        - { name: Message,  type: string,  jsonPath: .spec.message }
        - { name: Ready,    type: integer, jsonPath: .status.readyReplicas }
        - { name: Age,      type: date,    jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:                        # validation done by the API server itself
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [message]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                message:
                  type: string
                  minLength: 3
            status:
              type: object
              properties:
                readyReplicas: { type: integer }
