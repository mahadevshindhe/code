apiVersion: v1
kind: Namespace
metadata: { name: quota-demo }
---
# Caps the TOTAL a namespace (team) can consume
apiVersion: v1
kind: ResourceQuota
metadata: { name: team-quota, namespace: quota-demo }
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "8"
    persistentvolumeclaims: "2"
    services.loadbalancers: "0"
---
# Defaults and per-container min/max
apiVersion: v1
kind: LimitRange
metadata: { name: container-limits, namespace: quota-demo }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }     # applied when a container sets no request
      default:        { cpu: 250m, memory: 128Mi }   # applied when a container sets no limit
      max:            { cpu: "1", memory: 512Mi }
      min:            { cpu: 10m, memory: 16Mi }
