# Pod Security Admission: built-in enforcement of the Pod Security Standards (privileged / baseline / restricted)
apiVersion: v1
kind: Namespace
metadata:
  name: psa-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted     # reject violating pods
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted        # also warn on apply
