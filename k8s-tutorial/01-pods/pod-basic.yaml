apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
  labels:
    app: hello
    tier: backend
  annotations:
    description: "Basic pod - module 01"
spec:
  containers:
    - name: hello
      image: hello-app:1.0
      imagePullPolicy: IfNotPresent        # image was loaded into kind; never pull from a registry
      ports:
        - containerPort: 8080
      env:
        - name: APP_GREETING
          value: "Hello from a bare Pod"
        # Downward API: pod metadata exposed as env vars
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: POD_NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        - name: POD_IP
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 512Mi }
  restartPolicy: Always                     # Always | OnFailure | Never
