# Multi-container pod: containers share the network namespace (localhost) and can share volumes.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-pod
  labels: { app: sidecar-demo }
spec:
  volumes:
    - name: shared-html
      emptyDir: {}                         # lives as long as the POD lives
  containers:
    - name: web                            # main container: nginx serving shared volume
      image: nginx:1.27-alpine
      ports: [{ containerPort: 80 }]
      volumeMounts:
        - { name: shared-html, mountPath: /usr/share/nginx/html }
    - name: content-writer                 # sidecar: refreshes the file every 5s
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date > /html/index.html; sleep 5; done"]
      volumeMounts:
        - { name: shared-html, mountPath: /html }
    - name: localhost-checker              # sidecar: reaches 'web' via localhost (shared network namespace)
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -qO- http://localhost:80 && sleep 10; done"]
