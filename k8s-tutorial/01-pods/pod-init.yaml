# Init containers run to completion, in order, BEFORE app containers start.
apiVersion: v1
kind: Pod
metadata:
  name: init-pod
  labels: { app: init-demo }
spec:
  volumes:
    - name: html
      emptyDir: {}
  initContainers:
    - name: wait-for-dns                   # typical use: wait for a dependency
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup kubernetes.default.svc.cluster.local; do echo waiting for DNS; sleep 2; done"]
    - name: generate-content               # typical use: prepare files for the main container
      image: busybox:1.36
      command: ["sh", "-c", "echo '<h1>Prepared by init container</h1>' > /html/index.html"]
      volumeMounts:
        - { name: html, mountPath: /html }
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - { name: html, mountPath: /usr/share/nginx/html }
