# Classic demo: the file exists for 20s, then is deleted -> liveness fails -> container is restarted repeatedly.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-exec
  namespace: demo
spec:
  containers:
    - name: busy
      image: busybox:1.36
      args: ["sh", "-c", "touch /tmp/healthy; sleep 20; rm -f /tmp/healthy; sleep 600"]
      livenessProbe:
        exec: { command: ["cat", "/tmp/healthy"] }
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
