apiVersion: apps/v1
kind: Deployment
metadata: { name: hello, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: hello } }
  template:
    metadata: { labels: { app: hello } }
    spec:
      terminationGracePeriodSeconds: 40            # time between SIGTERM and SIGKILL
      containers:
        - name: hello
          image: hello-app:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe:                            # gives slow-starting JVM time; disables liveness until it succeeds
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 30                   # up to 90s to start
          livenessProbe:                           # fails -> kubelet RESTARTS the container
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:                          # fails -> pod REMOVED from Service endpoints (no restart)
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:                               # runs BEFORE SIGTERM: lets LBs/kube-proxy drop this pod first
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: hello, namespace: demo }
spec:
  selector: { app: hello }
  ports: [{ port: 80, targetPort: http }]
