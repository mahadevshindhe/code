spring.application.name=notes-app
server.port=8080
server.shutdown=graceful

# --- 12-factor config: everything overridable via env vars (docker -e / compose environment) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
spring.datasource.username=${DB_USER:notes}
# Docker/Swarm secrets are files in /run/secrets. configtree turns each file into a property
# (file db_password -> property "db_password"). Falls back to DB_PASSWORD env, then "notes".
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.password=${db_password:${DB_PASSWORD:notes}}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
