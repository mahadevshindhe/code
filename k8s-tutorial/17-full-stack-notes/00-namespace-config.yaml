apiVersion: v1
kind: Namespace
metadata:
  name: notes
  labels: { app.kubernetes.io/part-of: notes-platform }
---
apiVersion: v1
kind: Secret
metadata: { name: notes-secret, namespace: notes }
type: Opaque
stringData:
  db_password: "notes-pg-pass"          # mounted at /run/secrets/db_password -> Spring configtree
---
apiVersion: v1
kind: ConfigMap
metadata: { name: notes-config, namespace: notes }
data:
  DB_URL: "jdbc:postgresql://postgres:5432/notes"
  DB_USER: "notes"
  REDIS_HOST: "redis"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
