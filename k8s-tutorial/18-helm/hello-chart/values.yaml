replicaCount: 2

image:
  repository: hello-app
  tag: "1.0"
  pullPolicy: IfNotPresent

greeting: "Hello from Helm"
appVersion: "v1"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: hello-helm.localtest.me

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 512Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nameOverride: ""
fullnameOverride: ""
