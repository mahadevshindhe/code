apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hello.fullname" . }}-test"
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["curl", "--fail", "-s", "http://{{ include "hello.fullname" . }}:{{ .Values.service.port }}/hello"]
