events {}
http {
  # Docker's embedded DNS returns one A record per replica of service "hello".
  # 127.0.0.11 is Docker's DNS; valid=5s makes nginx re-resolve so scaling up/down is picked up.
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;
    set $upstream http://hello:8080;

    location / {
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
