# Module 09 - Observability: Prometheus + Grafana scraping Spring Boot Actuator metrics
name: observability

services:
  hello:
    build:
      context: ../apps/hello-app
      dockerfile: ../../02-multistage-builds/Dockerfile.layered
    image: hello-app:layered
    deploy:
      replicas: 2
    ports: ["8080-8081:8080"]     # two replicas -> host ports 8080 and 8081

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  promdata:
  grafanadata:
